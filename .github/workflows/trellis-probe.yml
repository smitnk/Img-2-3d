name: TRELLIS.2 CPU probe (trellis.cpp + Q4 GGUF on ARM64, RAM / time before a phone port)

on:
  push:
    paths: [".github/workflows/trellis-probe.yml", "tools/trellis/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: trellis-probe, cancel-in-progress: true }
env:
  TRELLIS_SHA: 6851891d706e2e26a8bb9dd99f28de851d68b64d
  HF: https://huggingface.co/ilintar/trellis2-gguf/resolve/main/q4
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        steps: [12, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Swap
        run: sudo fallocate -l 16G /swap2 && sudo chmod 600 /swap2 && sudo mkswap /swap2 >/dev/null && sudo swapon /swap2; free -m; nproc; lscpu | grep -E "Model name|Flags" | cut -c1-400
      - name: Build trellis-cli (CPU only)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build >/dev/null
          git clone -q https://github.com/pwilkin/trellis.cpp trellis.cpp && cd trellis.cpp && git checkout -q $TRELLIS_SHA
          git submodule update --init --recursive --depth 1 -q
          python3 $GITHUB_WORKSPACE/tools/trellis/patch_trellis.py .
          # the phone build: static, no OpenMP, Dimensity 7200 instruction set (no -march=native)
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTRELLIS_WEBP=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+i8mm+fp16 -DBUILD_SHARED_LIBS=OFF -DCMAKE_EXE_LINKER_FLAGS=-static > /tmp/cmake.txt 2>&1 || { tail -40 /tmp/cmake.txt; exit 1; }
          cmake --build build --target trellis-cli -j 4 2>&1 | tail -5
          ls -la build/trellis-cli || find build -name "trellis-cli*" -type f
      - name: Q4 weights (shape only, no texture) + cut-out photo
        run: |
          mkdir models out
          for f in dinov3 ss_flow ss_dec shape_flow_512 shape_dec; do curl -sSL --retry 5 -o models/$f.gguf $HF/$f.gguf; done
          ls -la models
          git clone -q --depth 1 https://github.com/smitnk/android-3d-model-forge /tmp/forge
          pip install -q --break-system-packages "rembg[cpu]" pillow
          python3 -c "
          from PIL import Image; from rembg import remove
          src = Image.open('/tmp/forge/assets/reference/lizard-warrior/front.png').convert('RGBA')
          # the reference is already a cut-out whose hidden RGB is smeared edge colour: rembg on that gave a full-frame
          # mask and TRELLIS built a flat plate. Put it on white first, like a real photo reaching the app.
          im = Image.new('RGBA', src.size, (255, 255, 255, 255)); im.alpha_composite(src)
          cut = remove(im)
          a = cut.split()[3].point(lambda v: 255 if v > 127 else 0); cut.putalpha(a)
          cut = cut.crop(a.getbbox()); cut.save('cut.png'); print('cut-out', im.size, '->', cut.size)"
      - name: Full run (real quality, real time, peak RAM)
        run: |
          push() {
            rm -rf /tmp/cilog && mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-trellis-${{ matrix.steps }}
            cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || echo none > none.txt
            git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "trellis probe $GITHUB_RUN_ID $1"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-trellis-${{ matrix.steps }}
            cd $GITHUB_WORKSPACE
          }
          run() {  # name steps timeout-minutes
            ( while sleep 60; do r=$(ps -C trellis-cli -o rss= | head -1); echo "MON $(date +%T) rss_mb=$(( ${r:-0} / 1024 )) free_mb=$(free -m | awk '/Mem/{print $7}')"; done ) >> out/$1.txt 2>/dev/null &
            MON=$!
            timeout ${3}m /usr/bin/time -v -o out/time_$1.txt ./trellis.cpp/build/trellis-cli cut.png out/$1.glb --models models --backend CPU \
              --res 512 --no-texture --steps $2 --threads 4 --faces 200000 --seed 42 --verbose --no-fa >> out/$1.txt 2>&1  # --no-fa: exact attention, 3.3x faster on CPU than FlashAttention
            echo "EXIT $? ($1, $2 steps)" | tee -a out/$1.txt
            kill $MON 2>/dev/null || true
            grep -E "Maximum resident|Elapsed" out/time_$1.txt || true
            grep -vE "^MON" out/$1.txt | tail -60
            ls -la out
            push $1
          }
          run full ${{ matrix.steps }} 300
