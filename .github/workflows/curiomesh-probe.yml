name: CurioMesh probe (quad retopology of a Hunyuan mesh in the phone's Blender 4.2 ARM64 runtime)

# Does the CurioMesh add-on (GPL-3, CurioCrafter/CurioMesh) run headless in the runtime the phone uses,
# how long does it take and how much RAM, with and without its Rust core built for linux-aarch64?
on:
  push:
    paths: [".github/workflows/curiomesh-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: curiomesh-probe, cancel-in-progress: true }
env:
  CURIO_SHA: bf0d12e
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        core: [native]
    steps:
      - name: Runtime, add-on, input mesh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download blender-runtime-v1 -R ${{ github.repository }} -p blender-runtime-arm64.tar.gz
          mkdir x && sudo tar -xzf blender-runtime-arm64.tar.gz -C x
          R=$(dirname $(dirname $(dirname $(sudo find x -path '*opt/blender/blender' -type f | head -1)))); echo "R=$PWD/$R" >> $GITHUB_ENV; echo rootfs $R
          mkdir w out && git clone -q https://github.com/CurioCrafter/CurioMesh w/curiomesh && git -C w/curiomesh checkout -q $CURIO_SHA
          git clone -q --depth 1 -b ci-logs-hunyuan-java-mv https://github.com/${{ github.repository }} mesh && cp mesh/java_mv_fast.glb w/in.glb && ls -la w
          nproc; free -m
      - name: Build the Rust core for linux-aarch64
        if: matrix.core == 'native'
        run: |
          pip install -q --break-system-packages "maturin[zig]"
          cd w/curiomesh/native && maturin build --release --zig --compatibility manylinux_2_28 2>&1 | tail -5
          mkdir -p ../_native/linux_aarch64 && unzip -o -j target/wheels/*.whl '*.so' -d ../_native/linux_aarch64 && ls -la ../_native/linux_aarch64
      - name: Retopologise
        run: |
          sudo mount --bind /proc $R/proc; sudo mount --bind /dev $R/dev; sudo mkdir -p $R/w && sudo mount --bind $PWD/w $R/w
          S=/w/curiomesh/skills/curiomesh-retopo/scripts/curiomesh_run.py
          run() {  # name use reduce-to extra...
            n=$1; u=$2; t=$3; shift 3
            ( while sleep 60; do echo "MON $(date +%T) rss_mb=$(( $(ps -C blender -o rss= | sort -n | tail -1) / 1024 )) free_mb=$(free -m | awk '/Mem/{print $7}')"; done ) >> out/$n.txt 2>/dev/null &
            MON=$!
            timeout 120m /usr/bin/time -v -o out/time_$n.txt sudo chroot $R env HOME=/root CURIOMESH_GPU=0 CURIOMESH_HELPERS=0 \
              /opt/blender/blender -b --factory-startup --python-exit-code 1 --python $S -- /w/in.glb --use $u --reduce-to $t \
              --out /w/$n.glb --report /w/$n.json --addon /w/curiomesh "$@" >> out/$n.txt 2>&1
            echo "EXIT $? ($n)" | tee -a out/$n.txt; kill $MON 2>/dev/null || true
            grep -E "Maximum resident|Elapsed" out/time_$n.txt || true
            grep -vE "^MON" out/$n.txt | tail -25
            cp w/$n.glb w/$n.json w/*.png out/ 2>/dev/null || true; cat w/$n.json 2>/dev/null | head -60
          }
          # The raw Hunyuan mesh is noisy: CurioMesh split it into 540 parts and the result was a patchwork with holes.
          # Clean it first the way Refine in Blender does (voxel remesh + smooth), then compare CurioMesh with plain QuadriFlow.
          cat > w/prep.py <<'PY'
          import bpy, sys
          a = sys.argv[sys.argv.index("--") + 1:]
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=a[0])
          o = [x for x in bpy.context.scene.objects if x.type == "MESH"][0]
          bpy.context.view_layer.objects.active = o; o.select_set(True)
          if a[2] == "clean":
              m = o.modifiers.new("r", "REMESH"); m.mode = "VOXEL"; m.voxel_size = max(o.dimensions) / 220; m.use_smooth_shade = True
              bpy.ops.object.modifier_apply(modifier="r")
              s = o.modifiers.new("s", "CORRECTIVE_SMOOTH"); s.iterations = 8; s.factor = 0.6
              bpy.ops.object.modifier_apply(modifier="s")
          else:
              print("QUADRIFLOW", bpy.ops.object.quadriflow_remesh(mode="FACES", target_faces=int(a[2]), use_mesh_symmetry=False))
          print("FACES", len(o.data.polygons), "quads", sum(len(p.vertices) == 4 for p in o.data.polygons))
          bpy.ops.export_scene.gltf(filepath=a[1], export_format="GLB")
          PY
          bl() { /usr/bin/time -v -o out/time_$1.txt sudo chroot $R env HOME=/root /opt/blender/blender -b --factory-startup --python-exit-code 1 --python /w/prep.py -- "${@:2}" 2>&1 | grep -E "FACES|QUADRIFLOW|Error|Traceback" | tee -a out/$1.txt; grep -E "Maximum resident|Elapsed" out/time_$1.txt; }
          bl clean /w/in.glb /w/clean.glb clean
          bl qf20k /w/clean.glb /w/qf20k.glb 20000
          bl qf8k /w/clean.glb /w/qf8k.glb 8000
          cp w/clean.glb w/qf20k.glb w/qf8k.glb out/ || true
          cp w/clean.glb w/in.glb
          run cm_game20k GAME 20000
          run cm_anim8k ANIMATION 8000
          ls -la out
      - name: Push results to ci-logs-curiomesh-${{ matrix.core }}
        if: always()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-curiomesh-${{ matrix.core }}
          cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || echo none > none.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "curiomesh probe $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-curiomesh-${{ matrix.core }}
