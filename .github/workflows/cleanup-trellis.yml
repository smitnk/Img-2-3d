name: One-off - delete the TRELLIS.2 release and its log branches
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          gh release delete trellis-v1 -R $R --cleanup-tag -y || true
          for b in $(gh api "repos/$R/git/matching-refs/heads/ci-logs-trellis" --jq '.[].ref'); do gh api -X DELETE "repos/$R/git/$b" && echo "deleted $b"; done
          gh release list -R $R
