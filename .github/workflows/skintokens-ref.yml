name: SkinTokens reference rig of the Hunyuan lizard (original PyTorch)

# Runs the original VAST-AI-Research/SkinTokens (MIT) TokenRig on CPU with flash-attention swapped for PyTorch SDPA,
# rigging a TripoSR mesh, and records peak RAM, time and the rig. Decides whether a phone port is realistic.
on:
  push:
    paths: [".github/workflows/skintokens-ref.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: skintokens-ref, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" && df -h /
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch SkinTokens + test meshes
        run: |
          git clone -q --depth 1 https://github.com/VAST-AI-Research/SkinTokens /tmp/st
          git clone -q --depth 1 https://github.com/smitnk/android-3d-model-forge /tmp/forge
          cd /tmp/st && git log -1 --format=%H
      - name: Install (CPU)
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/st/requirements.txt scipy scikit-learn networkx pymeshlab && python -c "import sys; sys.path.insert(0, '/tmp/st'); import demo" || true
          cp tools/skintokens/flash_attn_interface.py /tmp/st/
          sed -i 's/v.to("cuda")/v.to("cpu")/' /tmp/st/demo.py
          sed -i "s/device='cuda',/device='cpu',/" /tmp/st/src/server/spec.py
          sed -i 's/torch.bfloat16/torch.float32/g' /tmp/st/src/model/skin_vae_model.py /tmp/st/src/model/tokenrig.py /tmp/st/src/server/spec.py
          grep -rl flash_attention_2 /tmp/st/src /tmp/st/demo.py | xargs -r sed -i 's/flash_attention_2/sdpa/g'
          sed -i 's/return torch.cuda.get_device_name(0)/return torch.cuda.get_device_name(0) if torch.cuda.is_available() else "cpu"/; s/torch.cuda.synchronize()/torch.cuda.is_available() and torch.cuda.synchronize()/' /tmp/st/src/model/michelangelo/utils/misc.py
          grep -rln '"cuda"\|.cuda()' /tmp/st/demo.py /tmp/st/src | head
      - name: Download models
        run: cd /tmp/st && python download.py --model && du -sh experiments models
      - name: Rig the Hunyuan lizard
        run: |
          git clone -q --depth 1 -b ci-logs-hunyuan-java https://github.com/${{ github.repository }} /tmp/hj
          cp "$(ls /tmp/hj/*.glb | head -1)" /tmp/hunyuan_lizard.glb
          mkdir -p out && cd /tmp/st
          python demo.py --input /tmp/hunyuan_lizard.glb --output $GITHUB_WORKSPACE/out/hunyuan_ref.glb --num_beams 1 --use_transfer 2>&1 | tail -15
      - name: Joints vs model
        run: |
          python - <<'PY'
          import json,struct,numpy as np
          for f in ["/tmp/hunyuan_lizard.glb","out/hunyuan_ref.glb"]:
              b=open(f,'rb').read(); n=struct.unpack('<I',b[12:16])[0]; j=json.loads(b[20:20+n]); d=b[20+n+8:]
              def acc(i):
                  a=j['accessors'][i]; v=j['bufferViews'][a['bufferView']]; c={'VEC3':3,'MAT4':16}[a['type']]
                  return np.frombuffer(d,np.float32,a['count']*c,v.get('byteOffset',0)+a.get('byteOffset',0)).reshape(a['count'],c)
              P=np.concatenate([acc(p['attributes']['POSITION']) for m in j['meshes'] for p in m['primitives']])
              print(f,'mesh',P.min(0),P.max(0))
              if j.get('skins'):
                  ib=acc(j['skins'][0]['inverseBindMatrices']).reshape(-1,4,4).transpose(0,2,1)
                  jp=np.array([np.linalg.inv(m)[:3,3] for m in ib]); lo,hi=P.min(0),P.max(0); pad=.05*(hi-lo)
                  print(' joints',len(jp),'inside',np.all((jp>=lo-pad)&(jp<=hi+pad),1).mean(),jp.min(0),jp.max(0))
          PY
