name: Hunyuan3D - the app's Java pipeline (desktop JVM)

on:
  push:
    paths: ["core/src/main/java/com/smitnk/img23d/core/HunyuanShape.java", "core/src/test/java/com/smitnk/img23d/core/HunyuanShapeTest.java",
            "cli/src/main/java/com/smitnk/img23d/cli/Hunyuan.java", ".github/workflows/hunyuan-java.yml"]
  workflow_dispatch:
    inputs:
      octree: { description: "Final grid (256 or 128)", default: "256" }
permissions:
  contents: write
concurrency: { group: hunyuan-java, cancel-in-progress: true }
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Swap
        run: sudo fallocate -l 12G /swap2 && sudo chmod 600 /swap2 && sudo mkswap /swap2 >/dev/null && sudo swapon /swap2; free -m
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Unit tests
        run: |
          gradle :core:test :cli:installDist -q || { for f in core/build/test-results/test/*.xml; do grep -B2 -A12 "<failure" "$f"; done; exit 1; }
      - name: Published pack + cut-out photo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir hy && cd hy && gh release download hunyuan-v1 && ls -la && cd ..
          git clone -q --depth 1 https://github.com/smitnk/android-3d-model-forge /tmp/forge
          pip install -q "rembg[cpu]" pillow
          python -c "
          from PIL import Image; from rembg import remove
          im = Image.open('/tmp/forge/assets/reference/lizard-warrior/front.png').convert('RGBA')
          (remove(im.convert('RGB')) if im.getextrema()[3][0] == 255 else im).save('cutout.png')"
      - name: Run
        run: |
          set -o pipefail
          mkdir -p out
          (while sleep 20; do echo "MON $(free -m | awk '/Mem/{print "mem",$3} /Swap/{print "swap",$3}' | tr '\n' ' ') java_rss $(ps -C java -o rss= | sort -n | tail -1)"; done) &
          for fast in false true; do echo "== fast=$fast"
            JAVA_OPTS="-Dhunyuan.arena=false -Dhunyuan.fast=$fast" /usr/bin/time -v cli/build/install/cli/bin/cli hunyuan hy hy/hunyuan_info.json cutout.png out/java_app_fast_$fast.glb ${{ inputs.octree || '256' }} \
              2> >(grep -E "Maximum resident|Elapsed" >&2) | tee -a out/java.txt
          done
          python3 - <<'PY' | tee -a out/java.txt
          import json,struct,numpy as np
          from scipy.spatial import cKDTree
          def pts(f):
              b=open(f,'rb').read(); n=struct.unpack('<I',b[12:16])[0]; j=json.loads(b[20:20+n]); d=b[20+n+8:]
              a=j['accessors'][j['meshes'][0]['primitives'][0]['attributes']['POSITION']]; v=j['bufferViews'][a['bufferView']]
              return np.frombuffer(d,np.float32,a['count']*3,v.get('byteOffset',0)+a.get('byteOffset',0)).reshape(-1,3)
          A,B=pts('out/java_app_fast_false.glb'),pts('out/java_app_fast_true.glb')
          h=np.ptp(A,0).max(); dab=cKDTree(B).query(A)[0]; dba=cKDTree(A).query(B)[0]
          print(f"FAST_VS_NORMAL chamfer mean {(dab.mean()+dba.mean())/2/h:.4f}H, 95% {max(np.percentile(dab,95),np.percentile(dba,95))/h:.4f}H, max {max(dab.max(),dba.max())/h:.4f}H")
          PY
      - name: Push results to ci-logs-hunyuan-java
        if: always()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-hunyuan-java
          cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || echo none > none.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "hunyuan java $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-hunyuan-java
  mv:  # Hunyuan3D-2mv Turbo pack, three views, the phone's Fast mode
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Swap
        run: sudo fallocate -l 12G /swap2 && sudo chmod 600 /swap2 && sudo mkswap /swap2 >/dev/null && sudo swapon /swap2; free -m
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build
        run: gradle :cli:installDist -q
      - name: Published pack + the export check's cut-outs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir hy && cd hy && gh release download hunyuanmv-v1 && ls -la && cd ..
          git clone -q --depth 1 -b ci-logs-hunyuan-mv "https://github.com/${{ github.repository }}" views && ls views
      - name: Run
        run: |
          set -o pipefail
          mkdir -p out
          (while sleep 20; do echo "MON $(free -m | awk '/Mem/{print "mem",$3} /Swap/{print "swap",$3}' | tr '\n' ' ') java_rss $(ps -C java -o rss= | sort -n | tail -1)"; done) &
          JAVA_OPTS="-Dhunyuan.arena=false -Dhunyuan.fast=true" /usr/bin/time -v cli/build/install/cli/bin/cli hunyuan hy hy/hunyuan_info.json views out/java_mv_fast.glb ${{ inputs.octree || '256' }} \
            2> >(grep -E "Maximum resident|Elapsed|Exception|Error|^\s+at " >&2) | tee -a out/java_mv.txt
      - name: Push results to ci-logs-hunyuan-java-mv
        if: always()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-hunyuan-java-mv
          cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || echo none > none.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "hunyuan java mv $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-hunyuan-java-mv
