name: Blender GPU probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Runtime + Mesa (docker, same userland as the app)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -o pipefail
          gh release download blender-runtime-v1 -p blender-runtime-arm64.tar.gz
          docker import blender-runtime-arm64.tar.gz rt0
          cat > Dockerfile.probe <<'DF'
          FROM rt0
          RUN mkdir -p /var/cache/apt/archives/partial /var/lib/apt/lists/partial \
           && apt-get update -qq && apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1 mesa-utils-bin
          COPY tools/blender-runtime/gpu_test.py /opt/gpu_test.py
          DF
          docker build -q -t rt -f Dockerfile.probe . 2>&1 | tail -n 20 | tee setup.log
      - name: Variants
        run: |
          try() { name=$1; shift
            docker run --rm $(printf -- '-e %s ' LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe EGL_LOG_LEVEL=debug "$@") rt \
              /opt/blender/blender -b --python-exit-code 1 --python /opt/gpu_test.py > "v_$name.log" 2>&1
            echo "=== $name exit=$? $(grep -c 'GPUTEST render ok' v_$name.log) renders"
            grep -E "GPUTEST|EGL|libEGL|Error|error|OpenGL" "v_$name.log" | grep -v "added config" | head -n 30; }
          {
          echo "=== eglinfo surfaceless"; docker run --rm -e LIBGL_ALWAYS_SOFTWARE=1 rt eglinfo -p surfaceless 2>&1 | head -n 60
          try surfaceless EGL_PLATFORM=surfaceless
          try device EGL_PLATFORM=device
          try default EGL_LOG_LEVEL=debug
          try surfaceless_gl45 EGL_PLATFORM=surfaceless MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450
          } 2>&1 | tee log.txt
      - name: Push
        if: always()
        run: |
          mkdir /tmp/l && cat setup.log log.txt > /tmp/l/log.txt 2>/dev/null || true
          cd /tmp/l && git init -q -b ci-logs && touch log.txt && git add -A && git -c user.name=ci -c user.email=ci@l commit -qm "gpu probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
