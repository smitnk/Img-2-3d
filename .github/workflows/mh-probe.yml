name: probe MakeHuman system assets
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSfL -o a.zip https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip \
            || curl -sSfL -o a.zip https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
          mkdir -p /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-probe
          unzip -l $GITHUB_WORKSPACE/a.zip | awk '{print $1, $4}' > tree.txt
          mkdir x && cd x && unzip -q $GITHUB_WORKSPACE/a.zip
          { for f in $(find . -name "*.mhclo" | grep -E "hair/bob01|eyebrow001|eyelashes01|male_casualsuit01|shoes01" | head -5); do echo "=== $f"; grep -v "^[0-9]" "$f" | head -40; done
            for f in $(find . -name "*.mhmat" | grep -E "bob01|eyebrow001|eyelashes01|male_casualsuit01|young_caucasian_male|toon" | head -8); do echo "=== $f"; cat "$f"; done
            find . -name "*.png" -o -name "*.jpg" | head -0; find . \( -name "*.png" -o -name "*.jpg" \) -size +1M | head -20
            python3 -c "
          from PIL import Image; import glob
          for f in sorted(glob.glob('**/*diffuse*.png', recursive=True))[:10]+sorted(glob.glob('**/skins/**/*.png', recursive=True))[:6]: print(f, Image.open(f).size, Image.open(f).mode)" ; } > samples.txt 2>&1
          cd .. && rm -rf x && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-probe
