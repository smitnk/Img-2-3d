name: TRELLIS.2 phone pack (trellis.cpp static ARM64 + Q4 GGUF) -> release trellis-v1

on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: trellis-pack, cancel-in-progress: true }
env:
  TRELLIS_SHA: 6851891d706e2e26a8bb9dd99f28de851d68b64d
  HF: https://huggingface.co/ilintar/trellis2-gguf/resolve/main/q4
jobs:
  pack:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build trellis-cli (patched, static, phone CPU flags)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build >/dev/null
          git clone -q https://github.com/pwilkin/trellis.cpp trellis.cpp && cd trellis.cpp && git checkout -q $TRELLIS_SHA
          git submodule update --init --recursive --depth 1 -q
          python3 $GITHUB_WORKSPACE/tools/trellis/patch_trellis.py .
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTRELLIS_WEBP=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+i8mm+fp16 -DBUILD_SHARED_LIBS=OFF -DCMAKE_EXE_LINKER_FLAGS=-static > /tmp/cmake.txt 2>&1 || { tail -40 /tmp/cmake.txt; exit 1; }
          cmake --build build --target trellis-cli -j 4 2>&1 | tail -2
          strip build/trellis-cli && file build/trellis-cli | grep -q "statically linked"
      - name: Assemble and publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir pack && cd pack
          cp ../trellis.cpp/build/trellis-cli .
          cp ../trellis.cpp/LICENSE LICENSE-trellis.cpp.txt
          curl -sSLf -o LICENSE-TRELLIS.2.txt https://raw.githubusercontent.com/microsoft/TRELLIS.2/main/LICENSE
          curl -sSLf -o LICENSE-DINOv3.md https://raw.githubusercontent.com/facebookresearch/dinov3/main/LICENSE.md
          for f in dinov3 ss_flow ss_dec shape_flow_512 shape_dec; do curl -sSLf --retry 5 -o $f.gguf $HF/$f.gguf; done
          gh release download models-v1 -R ${{ github.repository }} -p u2net.onnx  # background removal, so it works without the TripoSR pack
          python3 - <<'PY'
          import hashlib, json, os
          def sha(f):
              h = hashlib.sha256()
              with open(f, "rb") as fh:
                  for b in iter(lambda: fh.read(1 << 22), b""):
                      h.update(b)
              return h.hexdigest()
          files = {f: {"bytes": os.path.getsize(f), "sha256": sha(f)} for f in sorted(os.listdir("."))}
          json.dump({"version": 1, "trellis_cpp": os.environ["TRELLIS_SHA"], "weights": "ilintar/trellis2-gguf q4", "files": files},
                    open("trellis_info.json", "w"), indent=1)
          print(json.dumps(files, indent=1))
          PY
          gh release view trellis-v1 -R ${{ github.repository }} >/dev/null 2>&1 || gh release create trellis-v1 -R ${{ github.repository }} --title "TRELLIS.2 for phones (trellis.cpp + Q4 GGUF) v1" \
            --notes "microsoft/TRELLIS.2 (MIT) shape stages as 4-bit GGUF (ilintar/trellis2-gguf) with a static ARM64 trellis.cpp build (pwilkin/trellis.cpp, MIT; patched by tools/trellis/patch_trellis.py). The DINOv3 image encoder is under Meta's DINOv3 License (included)."
          gh release upload trellis-v1 -R ${{ github.repository }} --clobber $(find . -maxdepth 1 -type f ! -name trellis_info.json)
          gh release upload trellis-v1 -R ${{ github.repository }} --clobber trellis_info.json
