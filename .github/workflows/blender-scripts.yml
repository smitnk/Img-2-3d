name: Blender scripts (builder / refine / custom) on ARM64

# Runs the app's Blender scripts (app/src/main/assets/blender) inside the published blender-runtime-v1
# userland on an ARM64 runner and validates every GLB.
on:
  push:
    paths: ["app/src/main/assets/blender/**", ".github/workflows/blender-scripts.yml"]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  scripts:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Unpack published runtime
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download blender-runtime-v1 -p blender-runtime-arm64.tar.gz
          mkdir rootfs && sudo tar -xzf blender-runtime-arm64.tar.gz -C rootfs
          sudo mkdir -p rootfs/opt/app && sudo cp -r app/src/main/assets/blender/. rootfs/opt/app/
          sudo mount -t proc proc rootfs/proc
      - name: Run scripts
        run: |
          set -o pipefail
          # same software-GL env as the app (BlenderRunner) so thumbnails / GPU bakes are tested the way the phone runs them
          B() { sudo chroot rootfs /usr/bin/env -i HOME=/root TMPDIR=/tmp LANG=C.UTF-8 PATH=/usr/bin:/bin EGL_PLATFORM=surfaceless \
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe XDG_CACHE_HOME=/tmp/.cache /bin/sh -c "cd /opt/app && /opt/blender/blender -b --factory-startup --python-exit-code 1 --python $*"; }
          run() { name=$1; shift; start=$(date +%s)
            if B "$@" > "log_$name.txt" 2>&1; then echo "$name OK $(( $(date +%s) - start ))s $(tail -n 1 log_$name.txt)"; else echo "$name FAILED"; tail -n 30 "log_$name.txt"; fi; }
          {
          run builder_default character_builder.py -- --out /tmp/o/b1
          run builder_variant character_builder.py -- --out /tmp/o/b2 --name SpikeCat --hair spiky --top hoodie --bottom pants \
            --shoes boots --eyes anime --ears animal --tail cat --accessory glasses --head 1.4 --leg-length 0.8 --smooth 2
          run builder_variant2 character_builder.py -- --out /tmp/o/b3 --name BigLizard --hair long --top tank --bottom skirt \
            --shoes none --eyes round --mouth open --ears pointy --tail lizard --accessory cape --belly 1.6 --body-width 1.4 --height 1.8
          run builder_crown character_builder.py -- --out /tmp/o/b4 --hair bun --top jacket --accessory crown --mouth flat --no-rig --smooth 0
          run custom_robot run_custom.py -- --script /opt/app/examples/robot.py --out /tmp/o/c1 --name Robot
          run refine_lizard refine_mesh.py -- --in /opt/forge/assets/reference/lizard-warrior/triposr.glb --out /tmp/o/r1 --height 1.6
          run refine_rig refine_mesh.py -- --in /opt/forge/assets/reference/lizard-warrior/triposr.glb --out /tmp/o/r2 --decimate 0.3 --rig
          run refine_texture refine_mesh.py -- --in /opt/forge/assets/reference/lizard-warrior/triposr.glb --out /tmp/o/r3 --decimate 0.3 --texture 1024 --rig
          run rigify_humanoid refine_mesh.py -- --in "$(ls rootfs/tmp/o/b4/*.glb | sed 's#^rootfs##')" --out /tmp/o/r4 --height 1.7 --rig
          grep -h "rigify\|baked\|texture bake" log_refine_texture.txt log_rigify_humanoid.txt || true
          for d in rootfs/tmp/o/*/; do g=$(ls "$d"*.glb | head -1 | sed 's#^rootfs##'); run "post_$(basename "$d")" postprocess.py -- --in "$g" --out "$(dirname "$g")"; done
          grep -h POSTPROCESS log_post_*.txt || true
          for pr in unity unreal_skeletal roblox godot web print; do run "export_$pr" export_preset.py -- --in "$(ls rootfs/tmp/o/r4/*.glb | sed 's#^rootfs##')" --preset $pr --out /tmp/o/x_$pr --name Hero; done
          grep -h "^EXPORT" log_export_*.txt || true
          } 2>&1 | tee results.txt
      - name: Validate GLBs
        run: |
          set -o pipefail
          pip install -q trimesh
          sudo chmod -R a+r rootfs/tmp/o
          python - <<'PY' | tee -a results.txt
          import glob, trimesh
          import json, os
          files = sorted(f for f in glob.glob("rootfs/tmp/o/*/*.glb") if "/x_" not in f)
          assert len(files) == 9, files
          for d in sorted(glob.glob("rootfs/tmp/o/*/")):
              if "/x_" in d:
                  e = json.load(open(d + "export.json")); print("export", e); assert e["bytes"] > 1000; continue
              q = json.load(open(d + "quality.json")); print(d, json.dumps(q)[:400])
              assert q["quality"] is not None and os.path.getsize(d + "thumb.png") > 2000, d
          for d in ("r3", "r4"):
              print(d, json.dumps({k: v for k, v in json.load(open(f"rootfs/tmp/o/{d}/generation.json")).items() if k in ("texture", "rig")}))
          assert json.load(open("rootfs/tmp/o/r3/generation.json"))["texture"]["coverage"] > 0.2
          for f in files:
              s = trimesh.load(f)
              n = sum(len(g.faces) for g in s.geometry.values())
              print(f.split("/o/")[1], "meshes", len(s.geometry), "faces", n, "extents", s.extents.round(3))
              assert n > 300
          PY
          mkdir -p glbs
          for f in rootfs/tmp/o/*/thumb.png; do sudo cp "$f" "glbs/thumb_$(basename "$(dirname "$f")").png"; done
          for f in rootfs/tmp/o/[!x]*/*.glb; do sudo cp "$f" "glbs/$(basename "$(dirname "$f")")_$(basename "$f")"; done
          sudo chown -R "$(id -u)" glbs && ls -la glbs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: script-glbs, path: glbs/ }
      - name: Push results to ci-logs branch
        if: always()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs
          cat "$GITHUB_WORKSPACE/results.txt" > log.txt 2>/dev/null || echo "no results" > log.txt
          git add log.txt && git -c user.name=ci -c user.email=ci@local commit -qm "scripts log $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
  viewer:
    # The app's viewer must load every GLB real Blender produces (multi-mesh, skins, node transforms).
    needs: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: script-glbs, path: viewer/src/test/resources/blender }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle :viewer:testDebugUnitTest --console=plain -i | grep -E "verts|FAILED|PASSED|tests completed" || true; gradle :viewer:testDebugUnitTest --console=plain
