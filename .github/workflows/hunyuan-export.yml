name: Hunyuan3D-2mini - ONNX int8 export for the phone

on:
  push:
    paths: ["tools/hunyuan/export_hunyuan.py", ".github/workflows/hunyuan-export.yml", "tools/skintokens/quant_llm.py"]
  workflow_dispatch:
    inputs:
      publish: { description: Publish hunyuan-v1, type: boolean, default: true }
permissions:
  contents: write
concurrency: { group: hunyuan-export, cancel-in-progress: true }
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space + swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          sudo fallocate -l 16G /swap2 && sudo chmod 600 /swap2 && sudo mkswap /swap2 >/dev/null && sudo swapon /swap2; free -g; df -h /
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install (CPU)
        run: |
          git clone -q --depth 1 https://github.com/Tencent-Hunyuan/Hunyuan3D-2 /tmp/hy
          git clone -q --depth 1 https://github.com/smitnk/android-3d-model-forge /tmp/forge
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/hy/requirements.txt || true
          pip install "transformers==4.46.3" "huggingface-hub<1.0" "diffusers<0.33" onnx==1.17.0 onnxruntime==1.20.0
          cd /tmp/hy && pip install -e . --no-deps
      - name: Export parts (one process each)
        run: |
          set -o pipefail
          mkdir -p hy out
          for p in vae geo dit cond; do
            sudo systemd-run --scope -q --uid=$(id -u) --gid=$(id -g) -p MemoryMax=13G -p MemorySwapMax=16G \
              --setenv=PATH="$PATH" --setenv=HOME="$HOME" /usr/bin/time -v python -u tools/hunyuan/export_hunyuan.py part $p hy \
              2> >(grep -E "Maximum resident|Elapsed|Error|error" | tee -a out/export.time >&2) | grep --line-buffered -v "it/s" | tee -a out/export.log
            rm -f hy/${p}_fp32.onnx* ; find hy -maxdepth 1 -type f ! -name "*.onnx*" ! -name "*.json" -delete
            ls -la hy
          done
      - name: Check int8 parts against the original pipeline
        run: |
          set -o pipefail
          python -u tools/hunyuan/export_hunyuan.py check hy /tmp/forge/assets/reference/lizard-warrior/front.png 2>&1 | grep --line-buffered -v "it/s" | tee out/check.log
          cp hy/*_info.json hy/check_*.glb out/
      - name: Push results to ci-logs-hunyuan-export
        if: always()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-hunyuan-export
          cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "hunyuan export $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-hunyuan-export
      - name: Publish hunyuan-v1
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd hy
          rm -f check_*.glb ref_*.npy
          python - <<'PY'
          import hashlib, json, os
          parts = {p: json.load(open(f"{p}_info.json")) for p in ("cond", "dit", "vae", "geo")}
          files = {f: {"bytes": os.path.getsize(f), "sha256": hashlib.sha256(open(f, "rb").read()).hexdigest()}
                   for f in sorted(os.listdir(".")) if os.path.isfile(f) and not f.endswith("_info.json")}
          json.dump({"version": 1, "parts": parts, "files": files}, open("hunyuan_info.json", "w"), indent=1)
          PY
          gh release view hunyuan-v1 >/dev/null 2>&1 || gh release create hunyuan-v1 --title "Hunyuan3D-2mini Turbo int8 v1" \
            --notes "tencent/Hunyuan3D-2mini (Tencent Hunyuan 3D 2.0 Community License; not licensed in the EU, UK or South Korea) exported to ONNX int8 for on-device shape generation."
          gh release upload hunyuan-v1 --clobber $(find . -maxdepth 1 -type f ! -name hunyuan_info.json ! -name "*_info.json")
          gh release upload hunyuan-v1 --clobber hunyuan_info.json
