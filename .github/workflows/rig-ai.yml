name: Rig with AI (SkinTokens) inside the phone's ARM64 Blender

on:
  push:
    paths: ["app/src/main/assets/blender/rig_ai.py", "app/src/main/assets/blender/skintok/**", ".github/workflows/rig-ai.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: rig-ai, cancel-in-progress: true }
jobs:
  rig:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Runtime + rig pack + test models
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download blender-runtime-v1 -p blender-runtime-arm64.tar.gz
          mkdir rootfs && sudo tar -xzf blender-runtime-arm64.tar.gz -C rootfs && rm blender-runtime-arm64.tar.gz
          sudo mkdir -p rootfs/opt/app rootfs/opt/pack rootfs/opt/in
          sudo cp -r app/src/main/assets/blender/. rootfs/opt/app/
          sudo cp tools/skintokens/pose_test.py rootfs/opt/app/
          mkdir pack && cd pack && gh release download skintokens-v1 && ls -la && cd .. && sudo cp -r pack/. rootfs/opt/pack/
          git clone -q --depth 1 https://github.com/smitnk/android-3d-model-forge /tmp/forge
          sudo cp /tmp/forge/assets/reference/lizard-warrior/triposr.glb rootfs/opt/in/triposr_lizard.glb
          git clone -q --depth 1 -b ci-logs-hunyuan-java https://github.com/smitnk/Img-2-3d.git /tmp/hj 2>/dev/null && \
            sudo cp "$(ls /tmp/hj/*.glb | head -1)" rootfs/opt/in/hunyuan_lizard.glb || true
          ls -la rootfs/opt/in
          sudo mount -t proc proc rootfs/proc && sudo mount --rbind /sys rootfs/sys && sudo mount --rbind /dev rootfs/dev  # like the app: proot -b /sys -b /dev
      - name: Rig
        run: |
          B() { sudo /usr/bin/time -v -o /tmp/time_$$.txt chroot rootfs /usr/bin/env -i HOME=/root TMPDIR=/tmp LANG=C.UTF-8 PATH=/usr/bin:/bin EGL_PLATFORM=surfaceless \
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe XDG_CACHE_HOME=/tmp/.cache /bin/sh -c "cd /opt/app && /opt/blender/blender -b --factory-startup --python-exit-code 1 --python $*"; }
          mkdir -p out
          for m in triposr_lizard hunyuan_lizard; do for y in 0 180; do
            [ -f rootfs/opt/in/$m.glb ] && B rig_ai.py -- --in /opt/in/$m.glb --pack /opt/pack --out /tmp/y --threads 4 --yaw $y --skeleton-only 2>&1 | grep "RIG skeleton" | sed "s/^/$m /"
          done; done
          for m in triposr_lizard hunyuan_lizard; do
            [ -f rootfs/opt/in/$m.glb ] || continue
            echo "== $m"
            B rig_ai.py -- --in /opt/in/$m.glb --pack /opt/pack --out /tmp/o/$m --threads 4 > out/log_$m.txt 2>&1 || echo "$m FAILED"
            grep -E "^RIG|Traceback|Error" out/log_$m.txt | grep -v cpuinfo | tail -20; sudo grep -hE "Maximum resident|Elapsed" /tmp/time_*.txt; sudo rm -f /tmp/time_*.txt
            if [ -f rootfs/tmp/o/$m/rigged.glb ]; then
              sudo cp rootfs/tmp/o/$m/rigged.glb out/${m}_rigged.glb
              sudo mkdir -p rootfs/tmp/pose/$m
              B pose_test.py -- /tmp/o/$m/rigged.glb /tmp/pose/$m > out/pose_$m.txt 2>&1 || echo "pose $m FAILED"
              grep -E "^(bones|POSE)|Error" out/pose_$m.txt | tail -10
              sudo cp rootfs/tmp/pose/$m/*.png out/ 2>/dev/null || true
            fi
          done
          sudo chown -R "$(id -u)" out
      - name: Push results to ci-logs-rigai
        if: always()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-rigai
          cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || echo none > none.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "rig ai $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-rigai
