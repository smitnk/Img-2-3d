name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Core unit tests (marching cubes, GLB, preprocessing)
        run: |
          set -o pipefail
          gradle :core:test :app:testDebugUnitTest --console=plain 2>&1 | tee -a build.log
      - name: Build APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :cli:installDist --console=plain 2>&1 | tee -a build.log
      - uses: actions/upload-artifact@v4
        with:
          name: img-2-3d-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Push build log to ci-logs branch
        if: failure()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs
          grep -E "^e: |error:|FAILED|What went wrong|Exception|expected|Unresolved" -A3 "$GITHUB_WORKSPACE/build.log" | head -n 300 > log.txt || true
          tail -n 80 "$GITHUB_WORKSPACE/build.log" >> log.txt
          git add log.txt && git -c user.name=ci -c user.email=ci@local commit -qm "build log $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
