name: Blender GPU probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Runtime + Mesa (docker, same userland as the app)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -o pipefail
          gh release download blender-runtime-v1 -p blender-runtime-arm64.tar.gz
          docker import blender-runtime-arm64.tar.gz rt0
          cat > Dockerfile.probe <<'DF'
          FROM rt0
          RUN mkdir -p /var/cache/apt/archives/partial /var/lib/apt/lists/partial \
           && apt-get update -qq && apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1 mesa-utils-bin
          COPY tools/blender-runtime/gpu_test.py /opt/gpu_test.py
          DF
          docker build -q -t rt -f Dockerfile.probe . 2>&1 | tail -n 20 | tee setup.log
      - name: Variants (proot, exactly like the app)
        run: |
          set -x
          cid=$(docker create rt /bin/true)
          mkdir rootfs
          docker export "$cid" | sudo tar -x -C rootfs
          ls rootfs | head; ls rootfs/opt
          set +x
          sudo apt-get install -y -qq libtalloc-dev uthash-dev libarchive-dev >/dev/null
          git clone -q --depth 1 https://github.com/termux/proot /tmp/proot && make -s -C /tmp/proot/src -j4 HAS_LOADER_32BIT= >/dev/null 2>&1
          export PROOT_LOADER=/tmp/proot/src/loader/loader LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe EGL_PLATFORM=surfaceless EGL_LOG_LEVEL=debug
          P=/tmp/proot/src/proot
          try() { name=$1; shift
            $P --kill-on-exit -0 --link2symlink -r rootfs "$@" -b /proc -b /sys -w /opt /opt/blender/blender -b --python-exit-code 1 --python /opt/gpu_test.py > "v_$name.log" 2>&1 && rc=0 || rc=$?
            echo "=== $name exit=$rc $(grep -c 'GPUTEST render ok' v_$name.log) renders"
            grep -vE "added config|^libEGL debug: +0x|^libEGL debug: ---" "v_$name.log" | head -n 40 || true; }
          {
          echo "=== proot"; ls -la $P $PROOT_LOADER; $P --version 2>&1 | head -n 3; $P -r rootfs /bin/true; echo "true exit=$?"
          $P -0 -r rootfs -b /proc /bin/ls /opt 2>&1 | head
          echo "=== host /dev/dri:"; ls -la /dev/dri 2>&1
          try bind_all_dev -b /dev
          try bind_selected -b /dev/null -b /dev/zero -b /dev/random -b /dev/urandom
          } 2>&1 | tee log.txt
      - name: Push
        if: always()
        run: |
          mkdir /tmp/l && cat setup.log log.txt > /tmp/l/log.txt 2>/dev/null || true
          cd /tmp/l && git init -q -b ci-logs && touch log.txt && git add -A && git -c user.name=ci -c user.email=ci@l commit -qm "gpu probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
