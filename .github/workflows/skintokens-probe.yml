name: SkinTokens CPU probe (RAM / time before an on-device port)

# Runs the original VAST-AI-Research/SkinTokens (MIT) TokenRig on CPU with flash-attention swapped for PyTorch SDPA,
# rigging a TripoSR mesh, and records peak RAM, time and the rig. Decides whether a phone port is realistic.
on:
  push:
    paths: ["tools/skintokens/**", ".github/workflows/skintokens-probe.yml"]
  workflow_dispatch:
    inputs:
      publish: { description: Publish skintokens-v1 (phone pack), type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: skintokens, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" && df -h /
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch SkinTokens + test meshes
        run: |
          git clone -q --depth 1 https://github.com/VAST-AI-Research/SkinTokens /tmp/st
          git clone -q --depth 1 https://github.com/smitnk/android-3d-model-forge /tmp/forge
          cd /tmp/st && git log -1 --format=%H
      - name: Install (CPU)
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/st/requirements.txt scipy scikit-learn networkx pymeshlab && python -c "import sys; sys.path.insert(0, '/tmp/st'); import demo" || true
          cp tools/skintokens/flash_attn_interface.py /tmp/st/
          sed -i 's/v.to("cuda")/v.to("cpu")/' /tmp/st/demo.py
          sed -i "s/device='cuda',/device='cpu',/" /tmp/st/src/server/spec.py
          sed -i 's/torch.bfloat16/torch.float32/g' /tmp/st/src/model/skin_vae_model.py /tmp/st/src/model/tokenrig.py /tmp/st/src/server/spec.py
          grep -rl flash_attention_2 /tmp/st/src /tmp/st/demo.py | xargs -r sed -i 's/flash_attention_2/sdpa/g'
          sed -i 's/return torch.cuda.get_device_name(0)/return torch.cuda.get_device_name(0) if torch.cuda.is_available() else "cpu"/; s/torch.cuda.synchronize()/torch.cuda.is_available() and torch.cuda.synchronize()/' /tmp/st/src/model/michelangelo/utils/misc.py
          grep -rln '"cuda"\|.cuda()' /tmp/st/demo.py /tmp/st/src | head
      - name: Download models
        run: cd /tmp/st && python download.py --model && du -sh experiments models
      - name: Rig TripoSR meshes on CPU
        run: |
          cd /tmp/st
          mkdir -p $GITHUB_WORKSPACE/out
          run() { name=$1; shift; /usr/bin/time -v python demo.py "$@" > $GITHUB_WORKSPACE/out/$name.log 2> $GITHUB_WORKSPACE/out/$name.time || echo "$name FAILED"
            echo "== $name: $(grep -E 'Maximum resident|Elapsed' $GITHUB_WORKSPACE/out/$name.time | tr -s ' ' | tr '\n' ';')"
            tail -n 15 $GITHUB_WORKSPACE/out/$name.time | grep -v "^\s" ; tail -n 8 $GITHUB_WORKSPACE/out/$name.log; }
          { run lizard_beam1 --input /tmp/forge/assets/reference/lizard-warrior/triposr.glb --output $GITHUB_WORKSPACE/out/lizard_beam1.glb --num_beams 1 --use_transfer
          } 2>&1 | tee $GITHUB_WORKSPACE/out/summary.txt
      - name: Export to ONNX + verify vs PyTorch
        if: always()
        run: |
          pip install -q onnx==1.17.0 onnxruntime==1.20.0
          cd /tmp/st
          python $GITHUB_WORKSPACE/tools/skintokens/test_quant_llm.py
          sudo fallocate -l 16G /swap2 && sudo chmod 600 /swap2 && sudo mkswap /swap2 >/dev/null && sudo swapon /swap2; free -g
          (while sleep 20; do echo "MON $(free -m | awk '/Mem/{print "mem",$3} /Swap/{print "swap",$3}' | tr '\n' ' ') disk $(df -m / | awk 'NR==2{print $4}')MB free" >&2; done) &
          sudo systemd-run --scope -q --uid=$(id -u) --gid=$(id -g) -p MemoryMax=12G -p MemorySwapMax=14G --setenv=PATH="$PATH" --setenv=HOME="$HOME" --setenv=PYTHONPATH="${PYTHONPATH:-}" /usr/bin/time -v python -u $GITHUB_WORKSPACE/tools/skintokens/export_skintokens.py export /tmp/forge/assets/reference/lizard-warrior/triposr.glb /tmp/stx 2> >(tee $GITHUB_WORKSPACE/out/export.time >&2) | tee $GITHUB_WORKSPACE/out/export.log | grep --line-buffered -v "it/s\|^ *-\?[0-9]" | tee $GITHUB_WORKSPACE/out/export.txt; grep -E "Error|error:" $GITHUB_WORKSPACE/out/export.time | tail -5 | tee -a $GITHUB_WORKSPACE/out/export.txt
          tail -30 $GITHUB_WORKSPACE/out/export.time | grep -v "^\s" | tail -12 >> $GITHUB_WORKSPACE/out/export.txt
          ls -la /tmp/stx | tee -a $GITHUB_WORKSPACE/out/export.txt
          cp /tmp/stx/skintokens_info.json $GITHUB_WORKSPACE/out/ 2>/dev/null || true
      - name: ONNX-only run (phone RAM estimate)
        if: always()
        run: |
          cd /tmp/st
          /usr/bin/time -v python -u $GITHUB_WORKSPACE/tools/skintokens/export_skintokens.py onnx /tmp/stx 2> $GITHUB_WORKSPACE/out/onnx.time | tail -10 | tee $GITHUB_WORKSPACE/out/onnx.txt
          grep -E "Maximum resident|Elapsed" $GITHUB_WORKSPACE/out/onnx.time | tee -a $GITHUB_WORKSPACE/out/onnx.txt
          tail -15 $GITHUB_WORKSPACE/out/onnx.time | grep -v "^\s" >> $GITHUB_WORKSPACE/out/onnx.txt || true
      - name: Pose test renders
        if: always()
        run: |
          for f in out/*.glb; do python tools/skintokens/pose_test.py "$f" "out/$(basename "$f" .glb)" 2>&1 | grep -E "^(bones|POSE)|Error|error" | tee -a out/summary.txt; done
      - name: Inspect rigs
        if: always()
        run: |
          pip install -q pygltflib
          python - <<'PY' | tee -a out/summary.txt
          import glob, pygltflib
          for f in sorted(glob.glob("out/*.glb")):
              g = pygltflib.GLTF2().load(f)
              print(f, "joints", sum(len(s.joints) for s in g.skins), "meshes", len(g.meshes))
          PY
      - name: Publish skintokens-v1
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir pack && cd /tmp/stx
          cp mesh_cond.onnx* vae_cond.onnx* skin_dec.onnx* llm_q.onnx* embed_f16.bin skintokens_info.json $GITHUB_WORKSPACE/pack/ 2>/dev/null; cd $GITHUB_WORKSPACE/pack
          # ONNX Runtime for the phone's Blender Python (3.11, aarch64 glibc): the wheel is a zip, unpacked on the phone
          pip download -q onnxruntime==1.20.0 --only-binary=:all: --no-deps --python-version 3.11 --platform manylinux_2_27_aarch64 -d whl
          mv whl/*.whl ort_py311_aarch64.zip && rmdir whl
          cp /tmp/st/LICENSE LICENSE-SkinTokens.txt 2>/dev/null || true
          ls -la
          python - <<'PY'
          import hashlib, json, os
          files = {f: {"bytes": os.path.getsize(f), "sha256": hashlib.sha256(open(f, "rb").read()).hexdigest()}
                   for f in sorted(os.listdir(".")) if os.path.isfile(f) and f != "rig_info.json"}
          json.dump({"version": 1, "files": files}, open("rig_info.json", "w"), indent=1)
          PY
          gh release view skintokens-v1 >/dev/null 2>&1 || gh release create skintokens-v1 --title "SkinTokens rig v1 (phone)" \
            --notes "VAST-AI-Research/SkinTokens (MIT) TokenRig exported to ONNX (int8 LLM) + onnxruntime 1.20 aarch64 wheel, for on-device auto-rigging."
          gh release upload skintokens-v1 --clobber $(ls | grep -v rig_info.json)
          gh release upload skintokens-v1 --clobber rig_info.json
          cp skintokens_info.json $GITHUB_WORKSPACE/out/
      - name: Push results to ci-logs-skintokens
        if: always()
        run: |
          mkdir /tmp/cilog && cd /tmp/cilog && git init -q -b ci-logs-skintokens
          cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "skintokens $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-skintokens
