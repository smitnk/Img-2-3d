name: Rig pack - refresh the onnxruntime wheel (phone Blender = Python 3.12, aarch64)

on: workflow_dispatch
permissions:
  contents: write
jobs:
  ort:
    runs-on: ubuntu-latest
    steps:
      - name: Swap the wheel in skintokens-v1 and refresh rig_info.json
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          mkdir p && cd p
          pip download -q onnxruntime==1.20.0 --only-binary=:all: --no-deps --python-version 3.12 --platform manylinux_2_27_aarch64 -d whl
          mv whl/*.whl ort_aarch64.zip && rmdir whl && ls -la
          gh release download skintokens-v1 -p rig_info.json
          python - <<'PY'
          import hashlib, json, os
          info = json.load(open("rig_info.json"))
          info["files"].pop("ort_py311_aarch64.zip", None)
          info["files"]["ort_aarch64.zip"] = {"bytes": os.path.getsize("ort_aarch64.zip"),
                                              "sha256": hashlib.sha256(open("ort_aarch64.zip", "rb").read()).hexdigest()}
          info["version"] = 2
          json.dump(info, open("rig_info.json", "w"), indent=1)
          PY
          gh release upload skintokens-v1 --clobber ort_aarch64.zip
          gh release upload skintokens-v1 --clobber rig_info.json
          gh release delete-asset skintokens-v1 ort_py311_aarch64.zip -y || true
